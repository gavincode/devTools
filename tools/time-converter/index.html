<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时间工具 · DevTools</title>
    <meta
      name="description"
      content="同一时刻在 CN / UTC / IST 时区间的换算工具,附 Unix 时间戳与一键复制。"
    />
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      .result-body {
        white-space: normal;
      }

      .result-body #result {
        white-space: pre-wrap;
      }

      .seg input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      input.placeholder-mode {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <div class="container nav-inner">
        <a class="nav-brand" href="../../">
          <span class="nav-logo">{}</span>
          <span>DevTools</span>
        </a>
        <a class="nav-link" href="../../">← 返回首页</a>
      </div>
    </header>

    <main class="container">
      <div class="tool-shell">
        <div class="tool-head">
          <span class="icon-tile tile-time" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </span>
          <div>
            <h1>时间工具</h1>
            <p>输入一个时间,查看它在 CN / UTC / IST 对应的时刻,点击结果即可复制。</p>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="timeInput">原时间</label>
          <input id="timeInput" type="text" autocomplete="off" />
        </div>

        <div class="option-row">
          <span class="option-label">原时区</span>
          <div class="segmented" id="zoneRadios" role="radiogroup" aria-label="原时区">
            <label class="seg active" role="radio" aria-checked="true">
              <input type="radio" name="sourceZone" value="Asia/Shanghai" checked />
              CN
            </label>
            <label class="seg" role="radio" aria-checked="false">
              <input type="radio" name="sourceZone" value="UTC" />
              UTC
            </label>
            <label class="seg" role="radio" aria-checked="false">
              <input type="radio" name="sourceZone" value="Asia/Kolkata" />
              IST
            </label>
          </div>
        </div>

        <div class="toolbar">
          <button type="button" class="btn primary" id="nowBtn">使用当前时间</button>
          <button type="button" class="btn ghost" id="clearBtn">清空</button>
        </div>

        <div class="result-panel">
          <div class="result-head">
            <span class="result-title">目标时间</span>
            <span class="pill neutral hidden" id="statusPill">就绪</span>
          </div>
          <div class="result-body">
            <div id="result">等待输入…</div>
            <div id="zoneResults" class="zone-list hidden"></div>
            <div class="time-meta hidden" id="timeMeta">
              <button type="button" class="copy-btn" id="copyTsBtn">复制 Unix 时间戳</button>
              <span id="tsValue"></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="toast" class="toast">已复制</div>

    <footer class="footer">
      <div class="container footer-inner">
        <span>DevTools · 数据仅在浏览器本地处理</span>
        <span>© 2026</span>
      </div>
    </footer>

    <script>
      const input = document.getElementById('timeInput');
      const result = document.getElementById('result');
      const zoneResults = document.getElementById('zoneResults');
      const timeMeta = document.getElementById('timeMeta');
      const tsValue = document.getElementById('tsValue');
      const statusPill = document.getElementById('statusPill');
      const toast = document.getElementById('toast');
      const sourceZoneInputs = document.querySelectorAll('input[name="sourceZone"]');
      const DEFAULT_PLACEHOLDER = '请输入时间,如 2026-08-08 12:00:00';

      function formatDateTime(date, timeZone) {
        const formatter = new Intl.DateTimeFormat('zh-CN', {
          timeZone,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = formatter.formatToParts(date);
        const map = Object.fromEntries(parts.map((part) => [part.type, part.value]));
        return `${map.year}-${map.month}-${map.day} ${map.hour}:${map.minute}:${map.second}`;
      }

      function getCurrentTimeForZone(timeZone) {
        return formatDateTime(new Date(), timeZone);
      }

      function getZoneOffsetMinutes(timeZone) {
        const zoneOffsetMap = {
          'Asia/Shanghai': 8 * 60,
          UTC: 0,
          'Asia/Kolkata': 5.5 * 60
        };
        return zoneOffsetMap[timeZone] ?? 0;
      }

      function parseTime(value, sourceZone) {
        if (!value || !value.trim()) {
          throw new Error('请输入原时间');
        }

        const text = value.trim();
        const normalized = text.replace(/\s+/g, ' ');
        const directMatch = normalized.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2})(?::(\d{1,2})(?::(\d{1,2}))?)?)?$/);

        if (directMatch) {
          const [, year, month, day, hour = '0', minute = '0', second = '0'] = directMatch;
          const utcDate = new Date(Date.UTC(
            Number(year),
            Number(month) - 1,
            Number(day),
            Number(hour),
            Number(minute),
            Number(second)
          ));
          return new Date(utcDate.getTime() - (getZoneOffsetMinutes(sourceZone) * 60 * 1000));
        }

        const parsed = Date.parse(normalized);
        if (!Number.isNaN(parsed)) {
          return new Date(parsed);
        }

        throw new Error('暂时无法识别该时间格式');
      }

      function getSelectedSourceZone() {
        return document.querySelector('input[name="sourceZone"]:checked').value;
      }

      function updateRadioSelection() {
        sourceZoneInputs.forEach((radio) => {
          const label = radio.closest('.seg');
          label.classList.toggle('active', radio.checked);
          label.setAttribute('aria-checked', String(radio.checked));
        });
      }

      function setPill(text, type) {
        statusPill.textContent = text;
        statusPill.className = 'pill' + (type ? ' ' + type : '');
        statusPill.classList.remove('hidden');
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast.timeoutId);
        showToast.timeoutId = window.setTimeout(() => {
          toast.classList.remove('show');
        }, 1200);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          showToast('已复制');
        } catch (error) {
          showToast('复制失败');
        }
      }

      function renderZones(date) {
        const sourceZone = getSelectedSourceZone();
        const zones = [
          { label: 'CN', value: 'Asia/Shanghai' },
          { label: 'UTC', value: 'UTC' },
          { label: 'IST', value: 'Asia/Kolkata' }
        ];

        const cards = zones.map((zone) => {
          const isCurrent = zone.value === sourceZone;
          const card = document.createElement('div');
          card.className =
            'zone-item copyable ' + (isCurrent ? 'source' : 'highlight');
          card.dataset.text = formatInZone(date, zone.value);
          card.title = '点击复制';

          const label = document.createElement('strong');
          label.textContent = zone.label + (isCurrent ? ' · 原时区' : '');
          const time = document.createElement('span');
          time.className = 'zone-time';
          time.textContent = formatInZone(date, zone.value);

          card.append(label, time);
          return card;
        });
        zoneResults.replaceChildren(...cards);
        zoneResults.classList.remove('hidden');
        result.classList.add('hidden');

        const timestamp = Math.floor(date.getTime() / 1000);
        tsValue.textContent = String(timestamp);
        timeMeta.classList.remove('hidden');
        setPill('转换成功', 'success');
      }

      function formatInZone(date, timeZone) {
        return formatDateTime(date, timeZone);
      }

      function convertTime() {
        try {
          const sourceZone = getSelectedSourceZone();
          const date = parseTime(input.value, sourceZone);
          renderZones(date);
        } catch (error) {
          result.textContent = '错误:' + error.message;
          result.classList.remove('hidden');
          zoneResults.replaceChildren();
          zoneResults.classList.add('hidden');
          timeMeta.classList.add('hidden');
          setPill('错误', 'error');
        }
      }

      function setDefaultValue() {
        if (input.value.trim()) {
          return;
        }
        input.value = getCurrentTimeForZone('Asia/Shanghai');
        input.classList.add('placeholder-mode');
      }

      function resetToNow() {
        input.value = getCurrentTimeForZone('Asia/Shanghai');
        input.classList.remove('placeholder-mode');
        convertTime();
      }

      document.getElementById('nowBtn').addEventListener('click', resetToNow);

      document.getElementById('clearBtn').addEventListener('click', () => {
        input.value = '';
        input.classList.remove('placeholder-mode');
        input.placeholder = DEFAULT_PLACEHOLDER;
        result.textContent = '等待输入…';
        result.classList.remove('hidden');
        zoneResults.replaceChildren();
        zoneResults.classList.add('hidden');
        timeMeta.classList.add('hidden');
        statusPill.classList.add('hidden');
        input.focus();
      });

      zoneResults.addEventListener('click', (event) => {
        const card = event.target.closest('.zone-item.copyable');
        if (!card) {
          return;
        }
        copyText(card.dataset.text);
      });

      document.getElementById('copyTsBtn').addEventListener('click', () => {
        copyText(tsValue.textContent);
      });

      input.addEventListener('focus', () => {
        input.placeholder = DEFAULT_PLACEHOLDER;
        if (input.value.trim() === '') {
          input.classList.add('placeholder-mode');
        } else {
          input.classList.remove('placeholder-mode');
          input.select();
        }
      });

      input.addEventListener('blur', () => {
        const trimmed = input.value.trim();
        if (!trimmed) {
          setDefaultValue();
          convertTime();
        } else {
          input.classList.remove('placeholder-mode');
        }
      });

      input.addEventListener('input', () => {
        input.classList.remove('placeholder-mode');
        convertTime();
      });

      sourceZoneInputs.forEach((radio) => {
        radio.addEventListener('change', () => {
          updateRadioSelection();
          setDefaultValue();
          convertTime();
        });
      });

      updateRadioSelection();
      setDefaultValue();
      convertTime();
    </script>
  </body>
</html>
