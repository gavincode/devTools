<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON 格式化</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="tool-shell">
        <a class="back-link" href="../../">← 返回首页</a>
        <h1>JSON 格式化</h1>
        <p>粘贴 JSON 文本并格式化或压缩。</p>

        <textarea id="jsonInput" placeholder='{"name":"demo","items":[1,2,3]}'></textarea>

        <div class="toolbar">
          <button id="formatBtn">格式化</button>
          <button id="minifyBtn">压缩</button>
          <button id="clearBtn">清空</button>
        </div>

        <div id="result" class="result"></div>
      </div>
    </main>

    <script>
      const input = document.getElementById('jsonInput');
      const result = document.getElementById('result');

      document.getElementById('formatBtn').addEventListener('click', () => {
        try {
          const parsed = JSON.parse(input.value);
          result.textContent = JSON.stringify(parsed, null, 2);
        } catch (error) {
          result.textContent = 'JSON 解析失败：' + error.message;
        }
      });

      document.getElementById('minifyBtn').addEventListener('click', () => {
        try {
          const parsed = JSON.parse(input.value);
          result.textContent = JSON.stringify(parsed);
        } catch (error) {
          result.textContent = 'JSON 解析失败：' + error.message;
        }
      });

      document.getElementById('clearBtn').addEventListener('click', () => {
        input.value = '';
        result.textContent = '';
      });
    </script>
  </body>
</html>
